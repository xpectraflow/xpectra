# Make sure to update the credential placeholders with your own secrets in your .env file.
# This template is optimized for production high-density telemetry streaming.
services:
  xpectra-consumer:
    image: ghcr.io/xpectraflow/xpectra-consumer:latest
    container_name: xpectra-consumer
    restart: always
    depends_on: &xpectra-depends-on
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      xpectra-migrate:
        condition: service_completed_successfully
    ports:
      - "${GRPC_PORT:-50051}:50051" # Secure public gRPC pipeline ingestion interface
      - "${INGEST_PORT:-50052}:50052" # Secure public HTTP ingestion interface
    environment: &xpectra-worker-env
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-postgres}
      GRPC_LISTEN_PORT: 50051
      XPECTRA_BACKEND_URL: ${XPECTRA_BACKEND_URL:-http://xpectra-web:3000}
      INGEST_BUFFER_MAX_POINTS: ${INGEST_BUFFER_MAX_POINTS:-}
      INGEST_FLUSH_INTERVAL_MS: ${INGEST_FLUSH_INTERVAL_MS:-}
      XPECTRA_S3_MEDIA_UPLOAD_REGION: ${XPECTRA_S3_MEDIA_UPLOAD_REGION:-auto}
      XPECTRA_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      XPECTRA_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
      XPECTRA_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      XPECTRA_S3_MEDIA_UPLOAD_EXTERNAL_ENDPOINT: ${XPECTRA_S3_MEDIA_UPLOAD_EXTERNAL_ENDPOINT:-http://localhost:9090}
      XPECTRA_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_AUTH: ${REDIS_AUTH:-myredissecret}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      SMTP_CONNECTION_URL: ${SMTP_CONNECTION_URL:-}

  xpectra-web:
    image: ghcr.io/xpectraflow/xpectra-web:latest
    container_name: xpectra-web
    restart: always
    depends_on: *xpectra-depends-on
    ports:
      - "${PORT:-3000}:3000" # Main console web panel interface
    environment:
      <<: *xpectra-worker-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GRPC_LISTEN_ADDR: ${GRPC_LISTEN_ADDR:-xpectra-consumer:50051}
      INGEST_SERVICE_HTTP_ADDR: ${INGEST_SERVICE_HTTP_ADDR:-http://xpectra-consumer:50052/ingest}
      # Initial seeding environment keys for first-start admin seeding
      XPECTRA_INIT_USER_EMAIL: ${XPECTRA_INIT_USER_EMAIL:-}
      XPECTRA_INIT_USER_NAME: ${XPECTRA_INIT_USER_NAME:-}
      XPECTRA_INIT_USER_PASSWORD: ${XPECTRA_INIT_USER_PASSWORD:-}
      XPECTRA_INIT_ORG_NAME: ${XPECTRA_INIT_ORG_NAME:-}

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: always
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - timescaledb_prod_data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432 # Keep PG database isolated locally for security
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/xpectra && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
    ports:
      - 127.0.0.1:9090:9000
      - 127.0.0.1:9001:9001 # Keep MinIO console secure behind loopback
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: >
      --requirepass ${REDIS_AUTH:-myredissecret}
      --maxmemory-policy noeviction
    ports:
      - 127.0.0.1:6379:6379 # Keep Redis isolated locally for security
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH:-myredissecret}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  # One-shot database migrator. Runs Drizzle migrations to completion BEFORE
  # xpectra-web / xpectra-consumer start (they gate on this via
  # service_completed_successfully). The production image contains the scripts/
  # directory and dependencies, making this safe and lightweight to run on redeploys.
  xpectra-migrate:
    image: ghcr.io/xpectraflow/xpectra-web:latest
    container_name: xpectra-migrate
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-postgres}
    command: ["node", "scripts/run-migrations.mjs"]

volumes:
  minio_prod_data:
    driver: local
  timescaledb_prod_data:
    driver: local
